<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Start your videos</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14150f">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
<link rel="stylesheet" href="forms.css?v=2">
</head>
<body>
<main>
  <div class="brand" id="brand">Cutroom</div>
  <h1>Let's make your videos</h1>
  <p class="soft">Under a minute. We research your business, your videos and your competitors ourselves, then come back with ideas.</p>

  <form id="f" novalidate autocomplete="on">
    <label>Business name <span class="req">*</span><input name="Business name" required autocomplete="organization"></label>
    <label>Your name <span class="req">*</span><input name="Contact name" required autocomplete="name"></label>
    <label>Phone or email <span class="req">*</span><input name="Phone or email" required autocomplete="tel"></label>
    <label>Suburb / town <span class="req">*</span><input name="Location" required placeholder="e.g. Palmerston, NT"></label>
    <label>What should the videos do for you? <span class="req">*</span></label>
    <div class="checks" data-group="Goals">
      <label><input type="checkbox" value="More enquiries or bookings">More enquiries or bookings</label>
      <label><input type="checkbox" value="Sell a product, property or service">Sell something specific</label>
      <label><input type="checkbox" value="Build trust and get known">Build trust and get known</label>
      <label><input type="checkbox" value="Grow followers">Grow followers</label>
      <label><input type="checkbox" value="Recruit staff">Recruit staff</label>
    </div>

    <p class="msg" id="msg" role="alert"></p>
    <button class="primary" type="submit">Finish</button>
  </form>

  <div class="done" id="done" hidden>
    <h2 style="border:0;margin-top:0;padding-top:0">Thanks! One last step</h2>
    <p>Send your answers to <span class="owner">us</span> with one of these buttons:</p>
    <button class="primary" type="button" id="share">Send my answers</button>
    <a class="secondary" id="mail" hidden>Email them</a>
    <button class="secondary" type="button" id="copy">Copy my answers</button>
    <p class="fine" id="copied"></p>
    <pre id="out" hidden></pre>
    <button class="secondary noprint" type="button" id="edit">Change an answer</button>
  </div>
</main>
<script type="module">
import { BUSINESS } from "./forms-config.js";
const $ = (s) => document.querySelector(s);
$("#brand").textContent = BUSINESS.name;
document.querySelectorAll(".owner").forEach((e) => (e.textContent = BUSINESS.owner));
const KEY = "cutroom-start-draft-v3";
const f = $("#f");
// keep a draft on this phone in case they leave half way
try { const d = JSON.parse(localStorage.getItem(KEY) || "{}"); for (const [k, v] of Object.entries(d)) { const el = f.elements[k]; if (el && typeof v === "string") el.value = v; else if (Array.isArray(v)) document.querySelectorAll(`[data-group="${k}"] input`).forEach((c) => (c.checked = v.includes(c.value))); } } catch {}
function answers() {
  const a = {};
  for (const el of f.elements) if (el.name && el.value.trim()) a[el.name] = el.value.trim();
  document.querySelectorAll("[data-group]").forEach((g) => { const v = [...g.querySelectorAll("input:checked")].map((c) => c.value); if (v.length) a[g.dataset.group] = v; });
  return a;
}
f.addEventListener("input", () => { try { localStorage.setItem(KEY, JSON.stringify(answers())); } catch {} });
function asText(a) {
  return `NEW CLIENT FORM - ${a["Business name"] || ""}\n` + Object.entries(a).map(([k, v]) => `${k}: ${Array.isArray(v) ? v.join(", ") : v}`).join("\n") + `\n\nSent ${new Date().toLocaleDateString("en-AU")}`;
}
f.onsubmit = (e) => {
  e.preventDefault();
  document.querySelectorAll(".missing").forEach((x) => x.classList.remove("missing"));
  const a = answers(), miss = [];
  for (const el of f.querySelectorAll("[required]")) if (!el.value.trim()) { miss.push(el.name); el.classList.add("missing"); }
  if (!a.Goals) { miss.push("Goals"); document.querySelector('[data-group="Goals"]').classList.add("missing"); }
  if (miss.length) { $("#msg").textContent = "Please fill in: " + miss.join(", ") + "."; document.querySelector(".missing").scrollIntoView({ behavior: "smooth", block: "center" }); return; }
  $("#msg").textContent = "";
  const text = asText(a);
  $("#out").textContent = text;
  f.hidden = true; $("#done").hidden = false; window.scrollTo(0, 0);
  if (BUSINESS.email) { const m = $("#mail"); m.hidden = false; m.href = `mailto:${BUSINESS.email}?subject=${encodeURIComponent("New client form - " + (a["Business name"] || ""))}&body=${encodeURIComponent(text)}`; }
  $("#share").hidden = !navigator.share && !BUSINESS.email;
  $("#share").onclick = async () => { if (navigator.share) { try { await navigator.share({ title: "New client form", text }); } catch {} } else $("#mail").click(); };
  $("#copy").onclick = async () => { try { await navigator.clipboard.writeText(text); $("#copied").textContent = `Copied. Paste it into a message to ${BUSINESS.owner}.`; } catch { $("#out").hidden = false; $("#copied").textContent = "Select the text below and copy it."; } };
};
$("#edit").onclick = () => { f.hidden = false; $("#done").hidden = true; };
</script>
</body>
</html>
